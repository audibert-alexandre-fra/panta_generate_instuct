# Taxonomie du pilote : thèmes, sous-thèmes, personas et quotas.
# Sert de graine à la génération (self-instruct) dans generate.py.
#
# Volume : 29 sous-thèmes (médical 8, famille 7, vie_quotidienne 7, école 7) x 3
# personas x n_per_cell exemples, redistribué par sous-thème selon la matrice de
# compatibilité `poids_personas` (les combinaisons persona x sous-thème non plausibles
# ont un poids de 0 et leur part est reportée sur les personas compatibles du même
# sous-thème). Le pilote initial visait 255 exemples (17 sous-thèmes x 3 personas x 5) ;
# la taxonomie a depuis été étoffée (29 sous-thèmes, plus d'intentions/concepts/types de
# question) pour absorber le sur-échantillonnage nécessaire à un passage à l'échelle
# (cible ~20 000 exemples, cf. discussion sur generate.slurm).
#
# Personas : organisés par tranche d'âge et niveau de langage/vocabulaire (enfant,
# adolescent, adulte), jamais par profil médical ou type de handicap précis — seul
# compte le niveau de communication (longueur, vocabulaire, grammaire) attendu pour
# cette tranche, pas le diagnostic sous-jacent.
#
# Comportement de l'assistant : un seul comportement, décliné en deux cas (cf.
# prompts.py). RÉPONSE : l'assistant répond directement, de façon factuelle. RENVOI :
# l'assistant n'est pas en position de savoir, il le dit et indique vers qui se
# tourner (le destinataire varie selon le thème, cf. interlocuteur_par_persona). Le
# critère de bascule n'est jamais le sujet mais la source de la réponse : dépend-elle
# de cette personne, de ce lieu, de ce moment ? Si oui, RENVOI ; sinon, RÉPONSE.
# Cible du jeu : 95 % RÉPONSE / 5 % RENVOI (ratio_reponse: 0.95), uniforme sur les
# quatre thèmes, y compris le thème médical. Le split RÉPONSE/RENVOI est calculé par generate.py à
# l'échelle de CHAQUE SOUS-THÈME (pas persona par persona) : le nombre de RENVOI est
# déterminé une seule fois pour tout le sous-thème puis réparti entre les personas
# compatibles (méthode du plus fort reste), avec un minimum d'un RENVOI garanti par
# sous-thème (cf. _plan_cells / _distribuer_renvoi dans generate.py). Un arrondi
# indépendant par persona (round(target * ratio_reponse)) ramenait le RENVOI à zéro dès
# que le quota par persona descendait à 1 exemple (round(1 * 0.9) = 1, donc
# target_renvoi = 0) : c'est ce qui avait fait disparaître entièrement le cas RENVOI du
# pilote.
#
# Chaque instruction et chaque output tiennent TOUJOURS en une seule phrase, jamais
# plusieurs phrases séparées par un point (cf. filters.plusieurs_phrases, qui rejette
# effectivement tout candidat qui ne le respecterait pas) : dans le cas RENVOI, l'objet
# de la question et le destinataire sont reliés dans une seule phrase par une virgule
# ou une conjonction, jamais deux phrases distinctes.
#
# Pour le cas RÉPONSE, deux axes supplémentaires sont tirés au sort en plus de
# l'intention (cf. generate._generate_instruction_pools) : un concept concret propre
# au thème (`themes.*.concepts`, amorce lexicale pour ancrer la question dans le monde
# plutôt que dans un commentaire méta sur le sous-thème) et un type de question
# (`types_question`, global, forme rhétorique).

parametres_generation:
  # Seuil de similarité cosinus (embeddings sentence-transformers) au-delà duquel deux
  # instructions du même sous-thème sont considérées comme des quasi-doublons.
  dedup_seuil_cosinus: 0.85
  # Plancher du nombre de candidats surgénérés par cellule (thème x sous-thème x
  # persona x cas) avant dédoublonnage et réduction au quota. La formule réelle est
  # max(surgeneration_min, cas_target * 3) (cf. generate._plan_cells), sans plafond
  # haut : un plafond fixe rendrait les cellules à gros quota structurellement
  # incapables d'atteindre leur cible dès que cas_target le dépasse (le pool ne peut
  # jamais grandir au-delà du plafond, quel que soit le taux de rejet) — c'était le cas
  # avec l'ancien `surgeneration_max: 15`, qui plafonnait déjà toute cellule à
  # cas_target > 5. À noter : un quota RENVOI de 1 exemple déclenche quand même une
  # surgénération de `surgeneration_min` candidats (12 par défaut) — potentiellement à
  # revoir à la baisse pour éviter de surgénérer inutilement beaucoup sur des quotas
  # RENVOI très faibles.
  surgeneration_min: 12
  # Seuil de similarité cosinus au-delà duquel une instruction générée est rejetée
  # pour être trop proche de l'exemple_instruction fourni dans le prompt (fuite de
  # l'exemple du persona). À arbitrer : valeur de départ prudente, à resserrer si des
  # quasi-recopies passent encore, à desserrer si trop de rejets légitimes.
  similarite_exemple_max: 0.88
  # Seuil de similarité cosinus en-deçà duquel une instruction générée est rejetée
  # pour être trop éloignée du sous-thème/de l'intention demandés (détection
  # heuristique d'incohérence sémantique). À arbitrer : proxy imparfait par embeddings
  # généraliste, pas une vraie analyse sémantique.
  coherence_similarite_min: 0.20
  # Seuil de similarité cosinus en-deçà duquel un output généré est rejeté pour être
  # trop éloigné du sous-thème/de l'intention demandés.
  pertinence_intention_min: 0.15
  # Nombre de mots au-delà duquel un output généré est rejeté. La règle "une seule
  # phrase" seule ne suffit pas : une phrase peut rester longue en enchaînant plusieurs
  # causes/exemples reliés par des virgules ou "ou". Valeur unique pour tous les
  # personas (l'output est toujours en français impeccable, contrairement à
  # l'instruction dont la longueur varie par persona).
  output_max_mots: 15

style_guide:
  registre: FALC (Facile à Lire et à Comprendre)
  regles:
    - Phrases courtes (une idée par phrase).
    - Vocabulaire concret, pas de jargon.
    - "Jamais d'écriture inclusive, ni dans l'instruction ni dans l'output (interdit :
      point médian comme \"enseignant·e\", parenthèse de genre comme \"enseignant(e)\") :
      utilise toujours la forme masculine générique (\"un enseignant\", \"un patient\"),
      ou si les deux genres doivent être nommés, la forme en toutes lettres (\"ta
      maîtresse ou ton maître\") plutôt qu'une abréviation typographique."
    - Pas d'expressions idiomatiques ni de sens figuré.
    - Ton direct et bienveillant, jamais infantilisant.
    - "Le champ instruction reflète un message composé via un système de CAA ; son degré
      de simplicité (longueur, vocabulaire, complexité syntaxique) doit correspondre au
      niveau de langage et à l'exemple donnés pour le persona (voir personas
      ci-dessous), mais il doit TOUJOURS être UNE SEULE phrase grammaticalement
      correcte et complète, jamais plusieurs phrases séparées par un point, quel que
      soit le persona (par ex. \"Pourquoi j'ai mal au ventre ?\" est correct). Une
      simple liste de mots juxtaposés sans lien grammatical (par ex. \"docteur pilule
      vert langue pourquoi\"), une phrase à laquelle il manque un article, une
      préposition ou un verbe conjugué (par ex. \"Maison pourquoi dire mal à
      docteur\"), ou une combinaison de mots qui n'a pas de sens (par ex. \"Combien de
      temps pour enfiler la ville ?\"), n'est jamais acceptable, quel que soit le
      persona : chaque mot choisi doit avoir un rapport clair avec le sous-thème et
      l'angle demandés."
    - "Interdiction que le champ instruction se limite à un ou deux mots isolés, ou à
      une liste de mots-clés sans lien grammatical entre eux : il doit toujours
      indiquer clairement, sous forme de phrase, ce que le persona veut savoir, dire
      ou demander."
    - "Quel que soit le persona, l'instruction ne consiste jamais en un enchaînement de
      mots sans structure sujet-verbe reconnaissable, même dans une instruction très
      courte (interdit par ex. \"Verdict arrêt à arrêt du médicament ?\", \"docteur
      pilule vert langue pourquoi\") : la simplicité vient de la longueur, du
      vocabulaire et de la structure syntaxique, jamais de l'absence de grammaire."
    - "Le champ output tient TOUJOURS en UNE SEULE phrase, jamais plusieurs phrases
      séparées par un point, complète, simple et adaptée au persona."
    - "Ni l'instruction ni l'output ne doivent inventer de détail contextuel précis qui
      n'est fourni nulle part (une date, une heure, l'agencement d'un lieu, un
      numéro, un nom propre...) : le sous-thème décrit une situation générique, pas un
      scénario avec des faits concrets définis. L'instruction reste une question ou
      une demande générale sur ce type de situation (ex. \"Pourquoi je dois rendre les
      devoirs si tôt ?\" plutôt que \"Pourquoi les devoirs sont-ils à rendre
      mercredi ?\"), et l'output ne doit jamais affirmer comme un fait un contenu ou
      un détail que l'assistant n'a reçu nulle part (interdit par ex. : \"les devoirs
      sont à rendre mercredi parce que...\", \"les toilettes sont à l'entrée du
      magasin, à gauche\")."
    - "Auto-suffisance : une instruction n'est valide que si l'assistant peut y
      répondre sans accès à un référent qu'il n'a jamais reçu (\"cet exercice\", \"la
      leçon\", \"ce document\", \"cette leçon\"...). Privilégier les questions
      explicatives : pourquoi (cause), comment (procédure), c'est quoi (définition),
      est-ce que c'est normal (norme), qu'est-ce qui se passe si (conséquence).
      Interdit : tout démonstratif ou défini renvoyant à un objet non introduit dans
      l'instruction elle-même. Exemple interdit : \"Comprends pas exercice, peux
      aider ?\"."
    - "Le cas RÉPONSE s'applique seulement si la réponse est la même pour n'importe
      qui, n'importe où, n'importe quand ; sinon c'est le cas RENVOI."
    - "Dans le cas RENVOI, l'output tient en une seule phrase composée de deux idées
      reliées par une virgule ou une conjonction, jamais deux phrases séparées par un
      point : d'abord la partie qui nomme l'objet précis de la question (jamais \"je ne
      peux pas répondre à cela/ça/ceci\", qui reste générique), ensuite la partie qui
      indique vers qui se tourner. La spécificité qui justifie le renvoi vient toujours
      d'un indexical (maintenant, ici, mon, ma, encore, aujourd'hui...), jamais d'un
      détail inventé (interdit par ex. \"Comment Marie a résolu son problème ?\")."
    - "Dans le cas RENVOI, l'output ne contient rien d'autre que ces deux idées reliées
      en une seule phrase : jamais d'avis sur normal/grave/bénin, jamais de cause ni
      d'explication partielle, quel que soit le thème (pas seulement le médical)."
    - "Dans le cas RENVOI, la reprise conserve le mot interrogatif de l'instruction
      sans jamais en changer le sens (si/pourquoi/comment/quand/où/quel/combien) ; le
      destinataire choisi est toujours pris tel quel dans la liste fournie par le
      thème, jamais énuméré, modifié ou complété par une précision inventée, et jamais
      un destinataire absent de cette liste."
    - "Dans le cas RÉPONSE, la réponse est donnée en entier, en une seule phrase :
      jamais de question renvoyée au persona en fin d'output, jamais d'annonce d'une
      réponse qui ne vient pas (interdit par ex. \"Je dois te donner plus de
      détails\"). Une question sur une durée reçoit une réponse qualitative, jamais un
      chiffre inventé."
    - "Les outputs varient de forme d'un exemple à l'autre (avec ou sans très courte
      formule d'introduction intégrée à la même phrase, longueur variable), mais
      tiennent TOUJOURS en une seule phrase : aucun patron unique (ex. \"Tu veux que
      je t'aide à... ?\") ne doit se répéter systématiquement."
    - "L'output ne recopie jamais l'instruction en préambule (interdit par ex. de
      commencer par reformuler ce que le persona vient de dire avant de répondre)."
    - "L'output n'utilise jamais l'impératif pour renvoyer la tâche à l'utilisateur
      (interdit par ex. \"Demande au professeur toi-même\", \"Il faut demander à ton
      camarade\") : l'assistant ne délègue jamais sa réponse au persona."
    - "Le registre d'adresse de l'assistant envers le persona (tu/vous) respecte
      strictement le registre_adresse déclaré pour ce persona."
    - "L'assistant ne s'engage jamais lui-même dans une action physique à la place du
      tiers réel avec qui le persona communique (interdit par ex. \"je viens vous
      aider à porter ça\", \"j'arrive tout de suite\") : il n'agit jamais physiquement
      dans la situation vécue par le persona."
    - "Le bruit caractéristique du moyen de CAA appartient uniquement au champ
      instruction ; l'output est toujours dans un français impeccable (orthographe,
      conjugaison, syntaxe), même quand l'instruction du persona est bruitée ou
      télégraphique."
    - "L'output se termine toujours par une ponctuation finale et referme tout
      guillemet ouvert : jamais de troncature en cours de phrase ou en plein
      guillemet."

# Formes rhétoriques pour une question du cas RÉPONSE, tirées au sort au même titre que
# l'intention et le concept (cf. generate._generate_instruction_pools). Le type
# "durée" est délibérément absent : il produit systématiquement des valeurs numériques
# inventées (ex. "15 à 30 minutes", "plus d'un an").
types_question:
  - "une question de définition (ex. \"c'est quoi...\", \"qu'est-ce que...\")"
  - "une question de cause (ex. \"pourquoi...\")"
  - "une question de procédure (ex. \"comment on fait pour...\")"
  - "une question de conséquence (ex. \"qu'est-ce qui se passe si...\")"
  - "une question de comparaison (ex. \"quelle différence entre... et...\")"
  - "une question de fonction (ex. \"à quoi ça sert...\")"
  - "une question de norme (ex. \"est-ce que c'est normal de...\")"
  - "une question d'identification (ex. \"comment on reconnaît...\")"
  - "une question de moyen (ex. \"avec quoi on peut...\")"
  - "une question d'origine (ex. \"d'où vient...\")"

# 3 personas, organisés par tranche d'âge et niveau de langage/vocabulaire (pas par
# profil médical ou type de handicap) : seul le niveau de communication attendu
# (longueur, vocabulaire, grammaire, moyen de CAA) est modélisé.
personas:
  - id: enfant
    age: "6-11 ans"
    niveau_langage: phrases très courtes et simples
    moyen_caa: tableau de pictogrammes
    longueur_max_mots: 6
    grammaire: "phrases courtes mais complètes, structure sujet-verbe-complément
      systématique, verbes conjugués correctement au présent (jamais d'infinitif à la
      place d'un verbe conjugué), articles et prépositions toujours présents comme
      dans une phrase normale, pas de subordonnée"
    registre_lexical: vocabulaire très concret, mots courts et familiers, aucune abstraction
    bruit_caracteristique: aucun bruit de forme (la phrase reste toujours complète et
      correcte) ; la simplicité vient uniquement de la brièveté et du vocabulaire très
      concret, jamais d'une grammaire dégradée
    registre_adresse: tu
    exemples_instruction_par_theme:
      medical:
        - "Pourquoi ma langue est verte ?"
        - "Pourquoi j'ai mal au ventre ?"
        - "Pourquoi ma chaussure fait mal ?"
        - "Pourquoi la piqûre fait peur ?"
        - "Pourquoi le sirop a mauvais goût ?"
      famille:
        - "Pourquoi maman est fâchée ?"
        - "Je peux jouer dehors ?"
        - "Mon frère prend mes jouets."
        - "Je veux un câlin maintenant."
        - "Papa revient quand ?"
      vie_quotidienne:
        - "Je peux avoir un bonbon ?"
        - "Le bruit fort me fait peur."
        - "Pourquoi la file est longue ?"
        - "Je veux m'asseoir."
        - "J'ai perdu mon doudou."
      ecole:
        - "Maîtresse, tu peux m'aider ?"
        - "Je peux jouer à la récré ?"
        - "Mon copain crie fort."
        - "Mon feutre est cassé."
        - "Il y a trop de bruit."
  - id: adolescent
    age: "12-17 ans"
    niveau_langage: phrases courtes
    moyen_caa: tablette de communication avec synthèse vocale
    longueur_max_mots: 12
    grammaire: phrases simples sujet-verbe-complément, conjugaison correcte au présent,
      ponctuation simple
    registre_lexical: vocabulaire courant d'adolescent, familier mais correct
    bruit_caracteristique: quasiment aucun bruit de forme ; phrases courtes surtout par
      fatigue de saisie, pas par erreur de forme
    registre_adresse: tu
    exemples_instruction_par_theme:
      medical:
        - "Le médicament me donne mal au ventre, c'est normal ?"
        - "Je dois prendre mon traitement combien de temps ?"
        - "J'ai un examen bientôt, ça fait mal ?"
        - "Je sens un truc bizarre depuis hier, je m'inquiète."
        - "Le docteur a dit un mot que je connais pas."
      famille:
        - "Je préfère pas y aller, c'est possible de dire non ?"
        - "Je suis crevé, on peut faire une pause ?"
        - "Ma sœur m'énerve, je veux le dire."
        - "J'ai besoin d'être seul un moment."
        - "Je suis content, j'ai envie de le dire à mes parents."
      vie_quotidienne:
        - "Le bus est en retard, je fais quoi ?"
        - "Je comprends pas le prix affiché."
        - "Je veux une place assise, c'est possible ?"
        - "J'ai pas compris ce qu'il a dit, il peut répéter ?"
        - "Je sais pas où aller, tu peux m'aider ?"
      ecole:
        - "J'ai pas compris la consigne, tu peux m'aider ?"
        - "Le prof va trop vite pour moi."
        - "Je veux participer plus en classe."
        - "Mon camarade a besoin d'aide, je peux ?"
        - "Je perds le fil, je sais pas où on en est."
  - id: adulte
    age: "18 ans et plus"
    niveau_langage: phrases complètes, plus développées que les tranches précédentes
    moyen_caa: dispositif de communication assistée (clavier à défilement ou commande
      oculaire) avec synthèse vocale
    longueur_max_mots: 18
    grammaire: phrases complètes avec subordonnées simples possibles, conjugaison correcte
    registre_lexical: vocabulaire adulte courant, plus riche que les tranches précédentes
    bruit_caracteristique: aucun bruit particulier ; longueur modérée car la saisie
      assistée est lente, mais la forme finale est toujours propre
    registre_adresse: vous
    exemples_instruction_par_theme:
      medical:
        - "Je voudrais savoir si un nouveau traitement peut me fatiguer plus que d'habitude."
        - "Je voudrais comprendre pourquoi un examen est nécessaire avant de l'accepter."
        - "J'aimerais qu'on m'explique la différence entre deux traitements possibles."
        - "Je ressens une gêne depuis quelques jours et je m'interroge."
        - "Je me demande si la fatigue que je ressens en ce moment est liée à mon traitement."
      famille:
        - "J'aimerais dire à mes proches que j'ai besoin d'un peu plus de temps seul."
        - "Je voudrais exprimer ma joie après une bonne nouvelle reçue aujourd'hui."
        - "J'aimerais demander de l'aide à un proche pour une tâche difficile seul."
        - "Je voudrais raconter à ma famille un moment agréable de ma journée."
        - "J'aimerais demander un peu plus de calme après une journée fatigante."
      vie_quotidienne:
        - "Je me demande pourquoi une démarche administrative prend autant de temps."
        - "Je souhaiterais savoir si je peux demander un délai supplémentaire pour une tâche."
        - "J'aimerais qu'on m'indique où trouver un service dans un magasin."
        - "Je voudrais demander si un trajet est facilement accessible."
        - "Je voudrais savoir si je peux demander qu'on m'explique une information plus lentement."

themes:
  medical:
    label: Médical
    contexte: Questions et échanges d'un patient avec un spécialiste (médecin, kiné, orthophoniste...).
    interlocuteur_par_persona:
      enfant: [ton docteur]
      adolescent: [ton médecin]
      adulte: [votre médecin, votre kinésithérapeute, votre orthophoniste]
    # Amorces lexicales concrètes pour le cas RÉPONSE (≥ 40) : objets, notions et
    # phénomènes médicaux courants, jamais un symptôme personnel du persona (ça reste
    # le rôle des intentions_renvoi).
    concepts:
      - un stéthoscope
      - une radiographie
      - une prise de sang
      - un pansement
      - un microbe
      - un virus
      - une bactérie
      - un vaccin
      - de la fièvre
      - un thermomètre
      - un plâtre
      - des béquilles
      - un fauteuil roulant
      - une ordonnance
      - un comprimé
      - un sirop médicamenteux
      - une piqûre
      - une allergie
      - un rhume
      - une infection
      - un pansement adhésif
      - un désinfectant
      - une IRM
      - un scanner
      - une échographie
      - le cœur
      - les poumons
      - le sang
      - les os
      - les muscles
      - la peau
      - un hôpital
      - une salle d'attente
      - une pharmacie
      - un masque chirurgical
      - des gants médicaux
      - une cicatrice
      - une vaccination
      - un régime alimentaire
      - le sommeil
      - l'hygiène des mains
      - un contrôle médical
      - un carnet de santé
      - une trousse de secours
      - une compresse
      - un inhalateur
      - une prise de tension
      - un appareil auditif
      - des lunettes de vue
      - une salle de soins
    contraintes_specifiques:
      - "Cas RENVOI (la réponse dépend de l'état de santé personnel du persona) :
        l'assistant n'est jamais présent au rendez-vous et ne connaît jamais l'état de
        santé réel du persona ; il dit seulement qu'il ne peut pas répondre et que
        c'est au médecin de le faire, sans jamais donner lui-même de diagnostic, de
        posologie ou de conseil médical direct, même partiel."
      - "Cas RÉPONSE (connaissance médicale générale, tous sous-thèmes) : l'assistant
        peut expliquer factuellement ce qu'est un terme, un examen ou un type de
        traitement courant (ex. \"C'est quoi une prise de sang ?\", \"À quoi sert un
        examen de la vue ?\"), mais jamais donner un avis sur le cas personnel du
        persona, un diagnostic, ni confirmer ou infirmer qu'un symptôme précis du
        persona est normal."
      - "Chaque fois que l'instruction ou l'output nomme une partie du corps (sous-thème
        parties_du_corps en particulier, mais aussi tout autre sous-thème qui y ferait
        référence), utiliser uniquement le vocabulaire courant compatible avec les
        pictogrammes ARASAAC (ex. \"bras\", \"jambe\", \"genou\", \"ventre\",
        \"cheville\", \"épaule\"), jamais un terme anatomique technique ou peu courant
        (ex. \"abdomen\", \"avant-bras\", \"articulation\", \"phalange\", \"thorax\")."
    quota_exemples: 120
    # ratio_reponse: 0.95 sur tous les sous-thèmes de ce thème, comme sur les trois
    # autres thèmes (cf. commentaire en tête de fichier) : pas de traitement différencié
    # du médical sur ce split RÉPONSE/RENVOI.
    sous_themes:
      - id: effets_secondaires
        description: Poser une question sur un effet secondaire ressenti.
        ratio_reponse: 0.95
        intentions_reponse:
          - ce qu'est un effet secondaire
          - pourquoi un médicament peut avoir des effets secondaires
          - où sont écrits les effets possibles d'un médicament
          - ce qu'est une notice de médicament
          - pourquoi certains médicaments doivent être pris avec de la nourriture
          - ce qu'est une allergie à un médicament
          - pourquoi deux médicaments peuvent interagir entre eux
          - la différence entre un effet secondaire courant et un effet secondaire rare
          - pourquoi il faut signaler un effet secondaire à un médecin
          - ce qu'est une intolérance à un médicament
          - pourquoi la même dose peut affecter différemment deux personnes
          - ce qu'est un médicament générique
          - pourquoi certains médicaments donnent envie de dormir
          - ce qu'est une contre-indication
        intentions_renvoi:
          - un effet inattendu ressenti peu après une prise
          - une gêne qui persiste depuis plusieurs jours
          - un changement physique remarqué depuis le début du traitement
          - une sensation inhabituelle qui inquiète
