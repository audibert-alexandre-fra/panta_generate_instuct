          adulte_aphasie_avc: 0
          adulte_sla: 0
          personne_agee_trouble_neuro: 0
        intentions_reponse:
          - la définition d'un mot de vocabulaire courant
          - ce que veut dire un mot appris en classe
          - ce qu'est une consigne en général
          - pourquoi on doit suivre des règles en classe en général
        intentions_renvoi:
