# Taxonomie du pilote : thèmes, sous-thèmes, personas et quotas.
# Sert de graine à la génération (self-instruct) dans generate.py.
#
# Volume cible : 4 thèmes x 4 sous-thèmes x 6 personas x 5 exemples = 480 exemples,
# redistribué par sous-thème selon la matrice de compatibilité `poids_personas` (les
# combinaisons persona x sous-thème non plausibles ont un poids de 0 et leur part est
# reportée sur les personas compatibles du même sous-thème).

parametres_generation:
  # Part des exemples de rôle A où l'assistant pose une question de clarification
  # plutôt que de proposer directement 2-3 formulations candidates (comportement par
  # défaut du rôle A, cf. style_guide.regles et prompts.py).
  clarification_ratio_role_a: 0.2
  # Seuil de similarité cosinus (embeddings sentence-transformers) au-delà duquel deux
  # instructions du même sous-thème sont considérées comme des quasi-doublons.
  dedup_seuil_cosinus: 0.85
  # Bornes du nombre de candidats surgénérés par cellule (thème x sous-thème x
  # persona) avant dédoublonnage et réduction au quota.
  surgeneration_min: 12
  surgeneration_max: 15
  # Seuil de similarité cosinus au-delà duquel une instruction générée est rejetée
  # pour être trop proche de l'exemple_instruction fourni dans le prompt (fuite de
  # l'exemple du persona). À arbitrer : valeur de départ prudente, à resserrer si des
  # quasi-recopies passent encore, à desserrer si trop de rejets légitimes.
  similarite_exemple_max: 0.88

style_guide:
  registre: FALC (Facile à Lire et à Comprendre)
  regles:
    - Phrases courtes (une idée par phrase).
    - Vocabulaire concret, pas de jargon.
    - Pas d'expressions idiomatiques ni de sens figuré.
    - Ton direct et bienveillant, jamais infantilisant.
    - "Le champ instruction reflète un message composé via un système de CAA ; son degré
      de simplicité (longueur, mots manquants, absence de conjugaison) doit
      correspondre au niveau de langage et à l'exemple donnés pour le persona (voir
      personas ci-dessous), mais il doit toujours rester une phrase à peu près
      correcte, reconnaissable comme une phrase même simplifiée (par ex. \"Pourquoi
      pilule fait langue verte, docteur ?\" est correct). Une simple liste de mots
      juxtaposés sans lien grammatical (par ex. \"docteur pilule vert langue
      pourquoi\") n'est jamais acceptable, quel que soit le persona."
    - "Interdiction que le champ instruction se limite à un ou deux mots isolés, ou à
      une liste de mots-clés sans lien grammatical entre eux : il doit toujours
      indiquer clairement, sous forme de phrase, ce que le persona veut savoir, dire
      ou demander."
    - Le champ output est toujours une phrase complète, simple et adaptée au persona.
    - "Ni l'instruction ni l'output ne doivent inventer de détail contextuel précis qui
      n'est fourni nulle part (une date, une heure, l'agencement d'un lieu, un
      numéro, un nom propre...) : le sous-thème décrit une situation générique, pas un
      scénario avec des faits concrets définis. L'instruction reste une question ou
      une demande générale sur ce type de situation (ex. \"Pourquoi je dois rendre les
      devoirs si tôt ?\" plutôt que \"Pourquoi les devoirs sont-ils à rendre
      mercredi ?\"), et l'output ne doit jamais affirmer comme un fait un contenu ou
      un détail que l'assistant n'a reçu nulle part (interdit par ex. : \"les devoirs
      sont à rendre mercredi parce que...\", \"les toilettes sont à l'entrée du
      magasin, à gauche\")."
    - "Auto-suffisance : une instruction n'est valide que si l'assistant peut y
      répondre sans accès à un référent qu'il n'a jamais reçu (\"cet exercice\", \"la
      leçon\", \"ce document\", \"cette leçon\"...). Privilégier les questions
      explicatives : pourquoi (cause), comment (procédure), c'est quoi (définition),
      est-ce que c'est normal (norme), qu'est-ce qui se passe si (conséquence),
      combien de temps (durée). Interdit : tout démonstratif ou défini renvoyant à un
      objet non introduit dans l'instruction elle-même. Exemple interdit : \"Comprends
      pas exercice, peux aider ?\" — exemple valide : \"Comment dire au professeur que
      c'est trop vite ?\"."
    - "Pour le rôle A, l'assistant propose par défaut directement 2 ou 3 formulations
      candidates que le persona pourrait dire à son interlocuteur ; il ne pose une
      question de clarification que si la situation est réellement ambiguë (cas
      minoritaire, cf. parametres_generation.clarification_ratio_role_a). \"Tu veux
      que je t'aide à... ?\" ne doit jamais être le patron systématique des outputs de
      rôle A."
    - "L'output ne recopie jamais l'instruction en préambule (interdit par ex. de
      commencer par reformuler ce que le persona vient de dire avant de répondre)."
    - "L'output n'utilise jamais l'impératif pour renvoyer la tâche à l'utilisateur
      (interdit par ex. \"Demande au professeur toi-même\", \"Explique-lui ce que tu
      ressens\") : l'assistant agit lui-même en formulant une proposition, jamais en
      délégant la tâche au persona."
    - "Le registre d'adresse de l'assistant envers le persona (tu/vous) respecte
      strictement le registre_adresse déclaré pour ce persona, y compris à l'intérieur
      des formulations candidates proposées."
    - "Règle globale (tous thèmes, pas seulement médical) : toute instruction portant
      sur un symptôme, une sensation ou un effet ressenti par le persona relève
      obligatoirement du rôle A. L'assistant ne dit jamais si c'est normal, grave ou
      bénin, et n'en propose jamais la cause ; il aide seulement à formuler une
      question à poser à un médecin et rappelle que seul un médecin peut répondre."
    - "Une instruction ne relève du rôle B que si elle a la même réponse pour
      n'importe qui, n'importe où, n'importe quand (sinon c'est le rôle A) ; une
      instruction de la forme \"comment dire...\", \"comment demander...\", \"comment
      expliquer...\" relève toujours du rôle A."
    - "L'assistant ne s'engage jamais lui-même dans une action physique à la place du
      tiers réel avec qui le persona communique (interdit par ex. \"je viens vous
      aider à porter ça\", \"j'arrive tout de suite\") : il aide à formuler ou
      transmettre un message, il n'agit jamais physiquement dans la situation vécue
      par le persona."
    - "Le bruit caractéristique du moyen de CAA appartient uniquement au champ
      instruction ; l'output est toujours dans un français impeccable (orthographe,
      conjugaison, syntaxe), même quand l'instruction du persona est bruitée ou
      télégraphique."

personas:
  - id: enfant_pictogrammes
    age: "6-10 ans"
    profil: trouble du spectre autistique
    niveau_langage: télégraphique (mots-clés)
    moyen_caa: tableau de pictogrammes
    longueur_max_mots: 6
    grammaire: "verbes seulement à l'infinitif ou au présent 3e personne (ex. \"fait\",
      \"veut\"), pas d'autre temps ni personne, pas de mots de liaison (articles,
      prépositions)"
    registre_lexical: vocabulaire très concret, mots courts et familiers, aucune abstraction
    bruit_caracteristique: mots-clés juxtaposés (pictogrammes sélectionnés un par un),
      articles et prépositions absents
    registre_adresse: tu
    exemples_instruction_par_theme:
      medical:
        - "Pilule fait langue verte, pourquoi ?"
        - "Ventre fait mal, pourquoi ?"
        - "Chaussure fait mal pied, pourquoi ?"
        - "Piqûre fait peur, pourquoi ?"
        - "Sirop goût bizarre, pourquoi ?"
      famille:
        - "Maman fâchée, pourquoi ?"
        - "Veut jouer dehors, possible ?"
        - "Frère prend jouet, pas content."
        - "Veut câlin, maintenant."
        - "Papa parti, revient quand ?"
      vie_quotidienne:
        - "Veut bonbon, magasin, possible ?"
        - "Bruit fort, fait peur."
        - "File longue, attendre combien ?"
        - "Veut assis, fatigué."
        - "Perdu doudou, aide cherche."
      ecole:
        - "Comprend pas, maîtresse aide ?"
        - "Veut jouer récré, possible ?"
        - "Copain crie, fait peur."
        - "Feutre cassé, aide donne ?"
        - "Trop bruit classe, gêne."
  - id: adolescent_synthese_vocale
    age: "11-17 ans"
    profil: infirmité motrice cérébrale (IMC)
    niveau_langage: phrases courtes
    moyen_caa: tablette à commande oculaire avec synthèse vocale
    longueur_max_mots: 12
    grammaire: phrases simples sujet-verbe-complément, conjugaison correcte au présent,
      ponctuation simple
    registre_lexical: vocabulaire courant d'adolescent·e, familier mais correct
    bruit_caracteristique: quasiment aucun bruit (saisie précise par commande oculaire) ;
      phrases courtes surtout par fatigue de saisie, pas par erreur de forme
    registre_adresse: tu
    exemples_instruction_par_theme:
      medical:
        - "Le médicament me donne mal au ventre, c'est normal ?"
        - "Je dois prendre mon traitement combien de temps ?"
        - "J'ai un examen bientôt, ça fait mal ?"
        - "Je sens un truc bizarre depuis hier, je m'inquiète."
        - "Le docteur a dit un mot que je connais pas."
      famille:
        - "Je préfère pas y aller, c'est possible de dire non ?"
        - "Je suis crevé, on peut faire une pause ?"
        - "Ma sœur m'énerve, je veux le dire."
        - "J'ai besoin d'être seul un moment."
        - "Je suis content, j'ai envie de le dire à mes parents."
      vie_quotidienne:
        - "Le bus est en retard, je fais quoi ?"
        - "Je comprends pas le prix affiché."
        - "Je veux une place assise, c'est possible ?"
        - "J'ai pas compris ce qu'il a dit, il peut répéter ?"
        - "Je sais pas où aller, tu peux m'aider ?"
      ecole:
        - "J'ai pas compris la consigne, tu peux m'aider ?"
        - "Le prof va trop vite pour moi."
        - "Je veux participer plus en classe."
        - "Mon camarade a besoin d'aide, je peux ?"
        - "Je perds le fil, je sais pas où on en est."
  - id: adulte_paralysie_cerebrale
    age: "18-40 ans"
    profil: paralysie cérébrale
    niveau_langage: phrases courtes à moyennes
    moyen_caa: clavier à défilement + synthèse vocale (contacteur)
    longueur_max_mots: 18
    grammaire: phrases complètes avec subordonnées simples possibles, conjugaison correcte
    registre_lexical: vocabulaire adulte courant
    bruit_caracteristique: aucun bruit particulier ; longueur modérée car la saisie au
      défilement est lente, mais la forme finale est propre
    registre_adresse: vous
    exemples_instruction_par_theme:
      medical:
        - "Je voudrais savoir si un nouveau traitement peut me fatiguer plus que d'habitude."
        - "Je voudrais comprendre pourquoi un examen est nécessaire avant de l'accepter."
        - "J'aimerais qu'on m'explique la différence entre deux traitements possibles."
        - "Je ressens une gêne depuis quelques jours et je m'interroge."
      famille:
        - "J'aimerais dire à mes parents que j'ai besoin d'un peu plus de temps seul."
        - "Je voudrais exprimer ma joie après une bonne nouvelle reçue aujourd'hui."
        - "J'aimerais demander de l'aide à mon frère pour une tâche difficile seul."
        - "Je voudrais raconter à ma famille un moment agréable de ma journée."
      vie_quotidienne:
        - "Je me demande pourquoi une démarche administrative prend autant de temps."
        - "Je souhaiterais savoir si je peux demander un délai supplémentaire pour une tâche."
        - "J'aimerais qu'on m'indique où trouver un service dans un magasin."
        - "Je voudrais demander si un trajet est facilement accessible."
  - id: adulte_aphasie_avc
    age: "40-65 ans"
    profil: aphasie suite à un AVC
    niveau_langage: télégraphique (mots isolés)
    moyen_caa: tableau alphabétique et pictogrammes
    longueur_max_mots: 6
    grammaire: "mots isolés ou groupes de 2-3 mots, verbes rarement conjugués, articles
      et prépositions généralement absents mais un mot de liaison occasionnel est
      possible (aphasie agrammatique réelle), jamais de subordonnée"
    registre_lexical: vocabulaire concret du quotidien, mots familiers uniquement
    bruit_caracteristique: hésitations et reprises, groupes de mots séparés par une
      virgule plutôt qu'une phrase liée
    registre_adresse: vous
    exemples_instruction_par_theme:
      medical:
        - "Depuis la pilule, langue verte, pourquoi ?"
        - "Bras, douleur, depuis hier."
        - "Fatigue, beaucoup, pourquoi ça ?"
        - "Piqûre, peur, dure longtemps ?"
      famille:
        - "Envie, câlin, maintenant."
        - "Fâché, frère, pourquoi lui ?"
        - "Content, aujourd'hui, bonne nouvelle."
        - "Aide, besoin, tâche lourde."
      vie_quotidienne:
        - "Repas, trop tard, pourquoi ?"
        - "Envie, sortir, dehors, possible ?"
        - "File, longue, attendre combien ?"
        - "Bruit, fort, gêne, beaucoup."
  - id: adulte_sla
    age: "40-65 ans"
    profil: sclérose latérale amyotrophique (SLA)
    niveau_langage: phrases complètes mais lentes à composer
    moyen_caa: commande oculaire + synthèse vocale
    longueur_max_mots: 20
    grammaire: phrases complètes et grammaticalement correctes, subordonnées possibles
    registre_lexical: vocabulaire adulte riche, orthographe soignée
    bruit_caracteristique: aucun bruit ; phrases propres et bien formées malgré la
      lenteur de composition, le dispositif attend la fin de la saisie
    registre_adresse: vous
    exemples_instruction_par_theme:
      medical:
        - "Est-ce qu'un médicament que je prends peut expliquer les taches vertes que j'ai vues sur ma langue ?"
        - "Je me demande si la fatigue que je ressens en ce moment est liée à mon traitement."
        - "Pourriez-vous m'aider à comprendre à quoi sert exactement un examen avant de l'accepter ?"
        - "J'aimerais savoir combien de temps dure habituellement un traitement."
      famille:
        - "J'aimerais expliquer à ma famille que j'ai besoin de plus de temps pour répondre."
        - "Je voudrais partager avec mes proches un moment agréable de ma journée."
        - "J'aimerais demander à mon conjoint un peu plus de calme après une journée fatigante."
      vie_quotidienne:
        - "Je voudrais savoir si je peux demander qu'on m'explique une information plus lentement."
        - "Je me demande si un trajet est accessible sans trop de difficulté."
        - "J'aimerais demander une alternative si un imprévu se présente."
  - id: personne_agee_trouble_neuro
    age: "65 ans et plus"
    profil: séquelles d'AVC / trouble neurodégénératif
    niveau_langage: phrases courtes
    moyen_caa: tableau de communication papier et gestes
    longueur_max_mots: 10
    grammaire: phrases courtes mais correctes, conjugaison simple au présent, peu de
      subordonnées
    registre_lexical: vocabulaire courant, parfois quelques tournures un peu datées
    bruit_caracteristique: quelques mots de liaison omis par fatigue de pointage, mais
      structure de phrase toujours reconnaissable
    registre_adresse: vous
    exemples_instruction_par_theme:
      medical:
        - "Le médicament me fait voir du vert, c'est normal docteur ?"
        - "J'ai du mal à me souvenir, c'est grave ?"
        - "Je ressens une gêne depuis quelques jours, pourquoi ?"
        - "Un traitement dure combien de temps, docteur ?"
      famille:
        - "Je voudrais un peu de calme, c'est possible ?"
        - "J'aimerais dire à mes enfants que je suis fatigué aujourd'hui."
        - "Je voudrais raconter un bon moment de ma journée."
        - "J'aimerais un peu d'aide pour une tâche à la maison."
      vie_quotidienne:
        - "Pourquoi je dois attendre autant, ici ?"
        - "J'aimerais qu'on m'aide pour une démarche administrative."
        - "Je voudrais savoir où se trouve un service près d'ici."
        - "Je préfère ne pas décider maintenant, c'est possible ?"

themes:
  medical:
    label: Médical
    contexte: Questions et échanges d'un·e patient·e avec un·e spécialiste (médecin, kiné, orthophoniste...).
    interlocuteur_par_persona:
      enfant_pictogrammes: ton docteur
      adolescent_synthese_vocale: ton médecin
      adulte_paralysie_cerebrale: votre médecin ou kinésithérapeute
      adulte_aphasie_avc: votre médecin ou orthophoniste
      adulte_sla: votre médecin ou kinésithérapeute
      personne_agee_trouble_neuro: votre médecin
    contraintes_specifiques:
      - "Rôle A (aide à communiquer avec le·la professionnel·le de santé) : l'assistant
        n'est jamais présent au rendez-vous et ne connaît jamais l'état de santé réel
        du persona ; il aide seulement à formuler ou clarifier la question à poser,
        sans jamais donner lui-même de diagnostic, de posologie ou de conseil médical
        direct."
      - "Rôle B (question de connaissance générale, tous sous-thèmes) : l'assistant
        peut expliquer factuellement ce qu'est un terme, un examen ou un type de
        traitement courant (ex. \"C'est quoi une prise de sang ?\", \"À quoi sert un
        examen de la vue ?\"), mais jamais donner un avis sur le cas personnel du
        persona, un diagnostic, ni confirmer ou infirmer qu'un symptôme précis du
        persona est normal."
    quota_exemples: 120
    sous_themes:
      - id: effets_secondaires
        description: Poser une question sur un effet secondaire ressenti.
        # Rôle A forcé : un effet secondaire ressenti est toujours personnel, jamais
        # une question de connaissance générale (cf. règle globale symptômes).
        ratio_connaissance: 0
        intentions_role_A:
          - un effet inattendu ressenti peu après une prise
          - une gêne qui persiste depuis plusieurs jours
          - un changement physique remarqué depuis le début du traitement
          - une réaction après avoir pris deux médicaments en même temps
          - une sensation inhabituelle qui inquiète
          - un effet qui empêche de faire une activité du quotidien
          - une envie de savoir si l'effet va s'arrêter tout seul
        intentions_role_B: []
      - id: douleur_gene
        description: Décrire une douleur ou une gêne physique.
        # Rôle A forcé : une douleur ressentie est toujours personnelle (cf. règle
        # globale symptômes).
        ratio_connaissance: 0
        intentions_role_A:
          - une douleur qui vient de commencer
          - une gêne qui revient régulièrement
          - une douleur qui s'aggrave avec un mouvement précis
          - une gêne qui empêche de dormir
          - une douleur difficile à localiser précisément
          - une gêne qui change d'intensité dans la journée
          - une douleur apparue après un effort
        intentions_role_B: []
      - id: clarification_traitement
        description: Demander une clarification sur un traitement ou un examen.
        # À arbitrer : proportion de rôle B (répartition 50/50 proposée).
        ratio_connaissance: 0.5
        intentions_role_A:
          - le but du traitement qui m'est proposé
          - la raison pour laquelle un examen m'est proposé
          - ce que signifie un terme médical que j'ai entendu à mon sujet
          - ce qui se passe si j'arrête mon traitement trop tôt
        intentions_role_B:
          - ce qu'est un examen médical courant
          - la façon dont un examen se déroule habituellement
          - la durée habituelle d'un traitement
          - la différence entre deux formes de traitement
      - id: preparation_rdv
        description: Préparer les questions à poser avant un rendez-vous.
        # À arbitrer : proportion de rôle B (minoritaire proposée, la préparation d'un
        # rendez-vous reste très majoritairement une démarche personnelle).
        ratio_connaissance: 0.3
        intentions_role_A:
          - une inquiétude à exprimer avant mon rendez-vous
          - un symptôme à ne pas oublier de mentionner
          - le souhait de préparer mes questions à l'avance
          - l'envie de savoir quoi dire en premier
          - une question sur le déroulement de mon prochain rendez-vous
        intentions_role_B:
          - ce qu'il faut apporter à un rendez-vous médical
          - la durée habituelle d'un rendez-vous médical

  famille:
    label: Famille
    contexte: Échanges avec les proches (parents, fratrie, enfants, conjoint·e).
    interlocuteur_par_persona:
      enfant_pictogrammes: tes parents
      adolescent_synthese_vocale: tes parents ou ta fratrie
      adulte_paralysie_cerebrale: votre famille (parents, fratrie, conjoint·e)
      adulte_aphasie_avc: votre famille (conjoint·e, enfants)
      adulte_sla: votre famille (conjoint·e, enfants)
      personne_agee_trouble_neuro: vos enfants ou vos proches
    contraintes_specifiques: []
    quota_exemples: 120
    sous_themes:
      - id: exprimer_emotion
        description: Exprimer une émotion (joie, colère, fatigue, inquiétude) à un proche.
        # Rôle A forcé : exprimer une émotion est toujours personnel et situationnel,
        # jamais une question de connaissance générale.
        ratio_connaissance: 0
        intentions_role_A:
          - une joie à partager
          - une colère ou une frustration à exprimer
          - une fatigue ressentie
          - une inquiétude à propos de quelque chose
          - un soulagement après un évènement
          - une tristesse à partager
          - une fierté à exprimer
        intentions_role_B: []
      - id: demander_aide_tache
        description: "Demander de l'aide à un proche pour une tâche du quotidien, sans
          préciser la tâche par un détail non fourni (rester générique : \"une tâche à
          la maison\", jamais \"la vaisselle de ce soir\")."
        # Rôle A forcé : demander de l'aide est toujours une démarche personnelle.
        ratio_connaissance: 0
        intentions_role_A:
          - une aide pour une tâche physique difficile à faire seul
          - une aide pour comprendre comment faire quelque chose
          - une aide pour terminer une tâche commencée
          - une aide pour une tâche qui prend beaucoup de temps
          - une aide ponctuelle pour un imprévu domestique
          - une aide pour porter ou déplacer quelque chose
          - une aide pour organiser une tâche à plusieurs étapes
        intentions_role_B: []
      - id: raconter_journee
        description: Raconter sa journée ou un évènement vécu.
        # Rôle A forcé : raconter sa propre journée est par nature personnel. C'est
        # sur ce sous-thème qu'une intention de rôle B ("une difficulté rencontrée
        # dans la journée") avait produit une hallucination de conseil médical
        # ("j'ai mal à la tête") en contournant la règle globale symptômes.
        ratio_connaissance: 0
        intentions_role_A:
          - un moment agréable vécu dans la journée
          - une difficulté rencontrée dans la journée
          - quelque chose d'inhabituel qui s'est passé
          - une rencontre faite dans la journée
          - un sentiment général sur la journée écoulée
          - une activité réussie dans la journée
          - quelque chose que le persona a appris dans la journée
        intentions_role_B: []
      - id: negocier_pause
        description: Négocier un moment calme ou une pause.
        # Rôle A forcé : négocier une pause est toujours une démarche personnelle.
        ratio_connaissance: 0
        intentions_role_A:
          - le besoin d'un moment de calme après une activité
          - une pause avant de continuer une tâche
          - le souhait de remettre quelque chose à plus tard
          - une fatigue qui justifie une pause
          - le besoin de silence pour se reposer
          - une pause pour reprendre des forces
          - le souhait de ralentir le rythme d'une activité
        intentions_role_B: []

  vie_quotidienne:
    label: Vie quotidienne
    contexte: Situations de la vie courante hors cercle familial et scolaire.
    interlocuteur_par_persona:
      enfant_pictogrammes: la personne en face de toi (vendeur, serveur, passant...)
      adolescent_synthese_vocale: la personne en face de toi (vendeur, serveur, agent de transport...)
      adulte_paralysie_cerebrale: la personne en face de vous (vendeur, serveur, agent de transport...)
      adulte_aphasie_avc: la personne en face de vous (vendeur, serveur, agent de transport...)
      adulte_sla: la personne en face de vous (vendeur, serveur, agent de transport...)
      personne_agee_trouble_neuro: la personne en face de vous (vendeur, serveur, agent de transport...)
    contraintes_specifiques: []
    quota_exemples: 120
    sous_themes:
      - id: demande_lieu_public
        description: Faire une demande dans un lieu public (restaurant, magasin, transport).
        # Rôle A forcé : la réponse dépend toujours du lieu précis (jamais la même
        # réponse "n'importe où"). C'est ce sous-thème qui avait produit des
        # hallucinations de lieu ("les toilettes sont sur la gauche...").
        ratio_connaissance: 0
        intentions_role_A:
          - demander où se trouve quelque chose dans un lieu public
          - demander de l'aide pour effectuer un achat
          - demander une information sur un service proposé
          - demander de patienter ou d'être aidé plus lentement
          - demander une précision sur un prix ou un horaire général
          - demander de répéter une information mal comprise
          - demander une place assise ou un aménagement
        intentions_role_B: []
      - id: gerer_imprevu
        description: "Réagir à un imprévu (retard, changement, contretemps) sans détail
          précis sur les circonstances (pas de lieu, d'heure ni d'évènement inventé)."
        # Rôle A forcé : un imprévu est par définition une circonstance particulière,
        # jamais une question à réponse universelle.
        ratio_connaissance: 0
        intentions_role_A:
          - signaler qu'on ne comprend pas ce qui se passe
          - demander ce qu'il faut faire face à un imprévu
          - demander de l'aide face à un changement soudain
          - exprimer qu'un imprévu cause de la difficulté
          - demander combien de temps un imprévu va durer
          - demander une alternative face à un imprévu
          - demander d'être prévenu si la situation change
        intentions_role_B: []
      - id: exprimer_preference_refus
        description: Exprimer une préférence ou un refus.
        # Rôle A forcé : exprimer une préférence est toujours personnel.
        ratio_connaissance: 0
        intentions_role_A:
          - exprimer une préférence entre deux options
          - refuser poliment une proposition
          - exprimer un besoin de plus de temps pour décider
          - exprimer que quelque chose ne convient pas
          - demander une autre option
          - exprimer un accord partiel
          - exprimer le souhait de ne pas faire quelque chose maintenant
        intentions_role_B: []
      - id: demander_itineraire
        description: Demander son chemin ou une information d'orientation.
        # Rôle A forcé : un itinéraire dépend toujours du lieu et du trajet précis
        # (jamais la même réponse "n'importe où"). C'est ce sous-thème qui avait
        # produit des hallucinations d'orientation ("l'horloge à l'entrée...").
        ratio_connaissance: 0
        intentions_role_A:
          - demander la direction à suivre pour aller quelque part
          - demander si un trajet est accessible facilement
          - demander combien de temps prend un trajet
          - demander s'il existe un chemin plus simple
          - demander de l'aide pour s'orienter
          - demander si on est dans la bonne direction
          - demander un repère pour se situer
        intentions_role_B: []

  ecole:
    label: École
    contexte: "Vie scolaire : classe, enseignant·e, camarades."
    interlocuteur_par_persona:
      enfant_pictogrammes: ta maîtresse ou ton maître
      adolescent_synthese_vocale: ton ou ta prof
    contraintes_specifiques: []
    quota_exemples: 120
    sous_themes:
      - id: question_enseignant
        description: Poser une question à un·e enseignant·e.
        # À arbitrer : seul sous-thème école avec un vrai angle de connaissance
        # générale (définition d'un mot), donc rôle B minoritaire mais non nul.
        ratio_connaissance: 0.3
        poids_personas:
          adulte_paralysie_cerebrale: 0
          adulte_aphasie_avc: 0
          adulte_sla: 0
          personne_agee_trouble_neuro: 0
        intentions_role_A:
          - demander une précision sur une consigne
          - demander pourquoi une règle de classe existe
          - demander combien de temps une activité va durer
          - demander ce qu'il faut faire ensuite
          - demander de répéter une explication plus lentement
          - demander une information générale sur le fonctionnement de la classe
        intentions_role_B:
          - la définition d'un mot de vocabulaire courant
          - ce que veut dire un mot appris en classe
      - id: aide_camarade
        description: "Demander ou proposer de l'aide à un·e camarade pour une activité
          scolaire, sans détail précis sur le contenu de l'activité (pas de matière,
          d'exercice ni de consigne inventés)."
        # Rôle A forcé : demander/proposer de l'aide à un camarade est toujours
        # situationnel.
        ratio_connaissance: 0
        poids_personas:
          adulte_paralysie_cerebrale: 0
          adulte_aphasie_avc: 0
          adulte_sla: 0
          personne_agee_trouble_neuro: 0
        intentions_role_A:
          - demander de l'aide pour une activité en cours
          - proposer de l'aide à un camarade en difficulté
          - demander qu'on répète une explication
          - demander de partager du matériel
          - proposer de faire une activité ensemble
          - demander de l'aide pour se repérer dans une consigne
          - demander à un camarade s'il a compris quelque chose
        intentions_role_B: []
      - id: activite_groupe
        description: Participer à une activité de groupe.
        # Rôle A forcé : participer à une activité de groupe précise est toujours
        # situationnel.
        ratio_connaissance: 0
        poids_personas:
          adulte_paralysie_cerebrale: 0
          adulte_aphasie_avc: 0
          adulte_sla: 0
          personne_agee_trouble_neuro: 0
        intentions_role_A:
          - proposer une idée pour l'activité de groupe
          - demander comment se répartir les tâches
          - exprimer le souhait de participer davantage
          - demander à quel moment c'est son tour
          - demander de l'aide pour comprendre le rôle de chacun
          - exprimer une difficulté à suivre le rythme du groupe
          - demander si tout le monde est d'accord sur une idée
        intentions_role_B: []
      - id: signaler_incomprehension
        description: "Signaler qu'on n'a pas compris quelque chose en classe (une
          consigne, une explication, une activité), sans détail précis sur le contenu
          (pas de matière ni de sujet inventés)."
        # Rôle A forcé : signaler une incompréhension sur un contenu de classe précis
        # est toujours situationnel. C'est ce sous-thème qui avait laissé fuiter
        # l'exemple médical du persona ("langue verte") sous un angle de rôle B.
        ratio_connaissance: 0
        poids_personas:
          adulte_paralysie_cerebrale: 0
          adulte_aphasie_avc: 0
          adulte_sla: 0
          personne_agee_trouble_neuro: 0
        intentions_role_A:
          - signaler qu'une explication est allée trop vite
          - demander qu'on reformule autrement
          - signaler qu'un mot n'est pas compris
          - demander une pause pour comprendre
          - signaler qu'on a perdu le fil de l'explication
          - demander un exemple pour mieux comprendre
          - signaler qu'on a besoin d'aide sans savoir quoi demander précisément
        intentions_role_B: []
