  ecole:
    label: École
    contexte: "Vie scolaire : classe, enseignant, camarades."
    # "ta maîtresse ou ton maître" / "ton ou ta prof" désignent UNE seule personne de
    # genre inconnu (variante grammaticale en toutes lettres, jamais un point médian ni
    # une parenthèse : pas une énumération de personnes différentes) : ne pas les
    # décomposer. "un camarade" est un destinataire alternatif : une question qui porte
    # sur un camarade (ex. dans aide_camarade) se renvoie vers lui, pas
    # systématiquement vers l'enseignant — et inversement, une question de procédure ou
    # d'autorité (ex. le tour de parole dans un groupe) se renvoie vers l'enseignant,
    # pas vers un camarade au hasard.
