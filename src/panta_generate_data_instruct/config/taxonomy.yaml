  ecole:
    label: École
    contexte: "Vie scolaire : classe, enseignant·e, camarades."
    # "ta maîtresse ou ton maître" / "ton ou ta prof" désignent UNE seule personne de
    # genre inconnu (variante grammaticale, pas une énumération de personnes
    # différentes) : ne pas les décomposer. "un camarade" est ajouté comme
    # destinataire alternatif : une question qui porte sur un camarade (ex. dans
    # aide_camarade) doit se renvoyer vers lui, pas systématiquement vers
    # l'enseignant·e.
    interlocuteur_par_persona:
      enfant_pictogrammes: [ta maîtresse ou ton maître, un camarade]
      adolescent_synthese_vocale: [ton ou ta prof, un camarade]
    contraintes_specifiques: []
    quota_exemples: 120
    sous_themes:
      - id: question_enseignant
        description: Poser une question à un·e enseignant·e.
        ratio_reponse: 0.5
        poids_personas:
